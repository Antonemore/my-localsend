name: Build Send2All iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - send2all
      - main

jobs:
  build_ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile SwiftUI Native App
        working-directory: ios-swift/Send2All
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iPhoneOS SDK: $SDK_PATH"
          
          # Biên dịch toàn bộ mã nguồn Swift thành binary arm64 native
          swiftc -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            Sources/*.swift \
            -o Send2All
          
          # Đóng gói cấu trúc ứng dụng iOS .app
          mkdir -p Payload/Send2All.app
          mv Send2All Payload/Send2All.app/
          cp Info.plist Payload/Send2All.app/
          
          # Đóng gói thành file .ipa chuẩn
          zip -qr Send2All-iOS.ipa Payload
          rm -rf Payload

      - name: Upload Send2All IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Send2All-iOS-IPA
          path: ios-swift/Send2All/Send2All-iOS.ipa
          retention-days: 7
