name: Build Send2All Windows PC Installer

on:
  workflow_dispatch:
  push:
    branches:
      - send2all
      - main

jobs:
  build_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        shell: bash
        working-directory: desktop-tauri
        run: npm install

      - name: Build Frontend (Vite + React)
        shell: bash
        working-directory: desktop-tauri
        run: npm run build

      - name: Build Windows Executable (Cargo Release)
        shell: bash
        working-directory: desktop-tauri/src-tauri
        run: cargo build --release

      - name: Build Windows NSIS Installer (Tauri CLI)
        shell: bash
        working-directory: desktop-tauri
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Rename Setup Installer
        shell: bash
        run: |
          mkdir -p release-dist
          if ls desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe 1> /dev/null 2>&1; then
            cp desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe release-dist/Send2All-v1.4.0-Windows-Setup.exe
          fi
          if [ -f "desktop-tauri/src-tauri/target/release/send2all-desktop.exe" ]; then
            cp desktop-tauri/src-tauri/target/release/send2all-desktop.exe release-dist/Send2All-v1.4.0-Windows-Portable.exe
          fi

      - name: Upload Windows PC Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Send2All-Windows-PC-v1.4.0
          path: release-dist/*.exe
          retention-days: 7

      - name: Publish to GitHub Release v1.4.0
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in release-dist/*.exe; do
            if [ -f "$f" ]; then
              echo "Uploading $f to GitHub Release v1.4.0..."
              gh release upload v1.4.0 "$f" --clobber || true
            fi
          done
