name: Build Send2All Windows PC Installer

on:
  workflow_dispatch:
  push:
    branches:
      - send2all
      - main

jobs:
  build_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: desktop-tauri
        run: npm install

      - name: Build Frontend (Vite + React)
        working-directory: desktop-tauri
        run: npm run build

      - name: Build Windows Tauri Executable and Installer
        working-directory: desktop-tauri
        run: |
          npx @tauri-apps/cli build

      - name: Upload Windows Installer and Exe
        uses: actions/upload-artifact@v4
        with:
          name: Send2All-Windows-PC
          path: |
            desktop-tauri/src-tauri/target/release/send2all-desktop.exe
            desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
